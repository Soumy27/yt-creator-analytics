# Which niches and channels to track.
#
# HOW TO PICK CHANNELS
# --------------------
# Aim for 15-30 channels per niche, deliberately spread across sizes:
#   ~5 large   (1M+ subs)
#   ~10 mid    (100k-1M)
#   ~10 small  (10k-100k)
#
# Why the spread matters: if you only track big channels, "views per
# subscriber" has no variance to explain and every correlation collapses.
# The small channels are where the interesting signal lives.
#
# HANDLES vs CHANNEL IDs — read this before adding anyone
# -------------------------------------------------------
# Both work, but @handles are NOT reliable identifiers. The handle namespace
# is heavily squatted: @marketfeed resolved to an unrelated 7-subscriber
# channel called "DDanimations", and @hebbarskitchen to a 93-subscriber
# impostor of the real 8M-subscriber channel. A handle resolving 200 in a
# browser only proves *something* is there, not that it is who you meant.
#
# This is not a cosmetic problem. The headline metric is views/subscriber,
# so a 1-subscriber impostor becomes a divide-by-one and produces
# astronomical garbage that would dominate every aggregate in the project.
#
# Channels below are pinned to UC... IDs wherever the handle was wrong or
# ambiguous. When adding a channel, confirm the subscriber count Step 2
# reports matches the creator you intended, and pin the ID if it does not.
#
# SAMPLING NOTE (say this before an interviewer says it to you)
# ------------------------------------------------------------
# This is a PURPOSIVE sample of Indian-market creators, not a random one.
# Findings describe these channels, not YouTube as a whole. The niches were
# chosen because Indian creators are less studied than US ones, which makes
# the project's market story concrete.
#
# One known non-independence: @takeUforward and @striver_79 are the same
# person (Raj Vikramaditya). Kept because the channels carry different
# content, but they are not two independent draws — worth a footnote if
# education_india results hinge on them.
#
# Audit the size spread after Step 2 with:
#
#   SELECT n.name,
#          COUNT(*) FILTER (WHERE c.subscriber_count >= 1000000) AS large,
#          COUNT(*) FILTER (WHERE c.subscriber_count BETWEEN 100000 AND 999999) AS mid,
#          COUNT(*) FILTER (WHERE c.subscriber_count <  100000) AS small
#   FROM channels c JOIN niches n USING (niche_id) GROUP BY 1;

